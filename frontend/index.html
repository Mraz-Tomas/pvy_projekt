<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>StudentBook</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- LEFT -->
    <div class="left">
        <h2>🏠 Menu</h2>
        <ul>
            <li onclick="loadPosts()">Zeď</li>
            <li onclick="goUsers()">Uživatelé</li>
        </ul>
    </div>

    <!-- CENTER -->
    <div class="center">
        <div class="newPost">
            <input id="title" placeholder="Nadpis">
            <textarea id="content" placeholder="Co máš na srdci?"></textarea>
            <button onclick="addPost()">Přidat</button>
        </div>

        <div id="posts"></div>
    </div>

    <!-- RIGHT -->
    <div class="right">
        <h3>👤 Účet</h3>
        <p id="username">Načítám...</p>
        <button onclick="logout()">Odhlásit</button>
    </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottomNav">
    <button onclick="loadPosts()">🏠</button>
    <button onclick="goUsers()">👥</button>
    <button onclick="logout()">🚪</button>
</div>

<script src="script.js"></script>
</body>
</html>
